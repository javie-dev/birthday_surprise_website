<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f6">
  <title>A birthday surprise for Lang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-page">
  <main class="gift-screen">
    <button class="gift-button" id="giftButton" type="button" aria-label="Open your birthday surprise">
        <span class="gift-sparkle sparkle-one">✦</span>
        <span class="gift-sparkle sparkle-two">✧</span>
      <span class="gift-light" aria-hidden="true"></span>
      <span class="gift-reveal" aria-hidden="true">♡</span>
      <span class="gift-heart heart-one" aria-hidden="true">♥</span>
      <span class="gift-heart heart-two" aria-hidden="true">♡</span>
      <span class="gift-heart heart-three" aria-hidden="true">♥</span>
        <span class="gift-lid"></span>
        <span class="gift-bow"></span>
        <span class="gift-box"><span class="gift-ribbon"></span></span>
        <span class="gift-shadow"></span>
    </button>
    <p class="tap-hint" id="tapHint">Tap the gift to open your surprise</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
